name: Deploy Application

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend syntax check
        run: |
          python -m compileall integrated-backend

      - name: Frontend lint
        run: |
          npm ci --prefix integrated-frontend
          npm run lint --prefix integrated-frontend

      - name: Frontend build
        run: |
          npm run build --prefix integrated-frontend

      - name: Compose configuration check
        run: |
          cp .env.example .env
          docker compose config >/dev/null

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via AWS SSM
        run: |
          # The shell script that will run on the EC2 instance
          COMMANDS='
          set -e
          
          # Ensure app directory exists
          mkdir -p ${{ secrets.EC2_APP_DIR }}
          cd ${{ secrets.EC2_APP_DIR }}
          
          # Decode the environment variables from the GitHub Secret
          echo "${{ secrets.APP_ENV_FILE_B64 }}" | base64 -d > .env
          chmod 600 .env
          
          # Source the .env to get PUBLIC_ORIGIN and passwords
          set -a
          . ./.env
          set +a
          
          # Ensure it is a git repository
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/LearnMateAI/project.git
          fi
          
          git fetch origin
          git checkout deployment || git checkout -b deployment origin/deployment
          git reset --hard origin/deployment
          
          chmod +x ./scripts/configure-keycloak.sh
          docker compose up -d --build --remove-orphans
          
          # Wait a few seconds for keycloak to start
          sleep 10
          
          PUBLIC_ORIGIN="$PUBLIC_ORIGIN" KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            COMPOSE_CMD="docker compose" ./scripts/configure-keycloak.sh
            
          docker compose ps
          '
          
          echo "Sending command to EC2 Instance: ${{ secrets.EC2_INSTANCE_ID }}"
          SCRIPT_B64=$(echo "$COMMANDS" | base64 -w 0)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy LearnMate via GitHub Actions" \
            --parameters commands="echo $SCRIPT_B64 | base64 -d | bash" \
            --query "Command.CommandId" \
            --output text)
            
          echo "Waiting for SSM command $COMMAND_ID to complete..."
          
          aws ssm wait command-executed \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --command-id "$COMMAND_ID"
            
          echo "Deployment Output:"
          aws ssm get-command-invocation \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --command-id "$COMMAND_ID" \
            --query "StandardOutputContent" \
            --output text
