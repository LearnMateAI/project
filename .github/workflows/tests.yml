name: tests

on:
  push:
  pull_request:

jobs:
  backend-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light test stack
        run: pip install -r testing/requirements.txt

      - name: Unit + integration suites (no live services, no GGUF)
        run: python -m pytest testing/unit testing/integration -q

      - name: Install extras needed only by integrated-backend/tests
        run: pip install langgraph python-docx python-pptx

      - name: integrated-backend suite (learnmate package imports LangGraph, no GGUF load)
        working-directory: integrated-backend
        run: python -m pytest tests -q
