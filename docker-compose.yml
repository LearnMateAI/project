services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    networks:
      default: null
    volumes:
      - type: volume
        source: mongo_data
        target: /data/db
        volume: {}
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${PUBLIC_HOST}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./integrated-backend/keycloak/realm:/opt/keycloak/data/import:ro
      - ./integrated-backend/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<> /dev/tcp/127.0.0.1/8080; echo -e \"GET /auth/health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n\" >&3; head -n 1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: ./integrated-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
      KEYCLOAK_ENABLED: "true"
      KEYCLOAK_ISSUER: ${PUBLIC_ORIGIN}/auth/realms/learnmate
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/learnmate/protocol/openid-connect/certs
      LEARNMATE_MONGODB_URI: mongodb://mongo:27017
      LEARNMATE_MONGODB_DB: learnmate
      LEARNMATE_QDRANT_URL: http://qdrant:6333
      LEARNMATE_QDRANT_COLLECTION: learnmate_chunks
      LEARNMATE_MODELS_DIR: /app/models
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - model_data:/app/models
      - hf_cache:/app/data/hf_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./integrated-frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_KEYCLOAK_URL: /auth
        VITE_KEYCLOAK_REALM: learnmate
        VITE_KEYCLOAK_CLIENT_ID: learnmate-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  mongo_data:
  qdrant_data:
  keycloak_data:
  model_data:
  hf_cache:
