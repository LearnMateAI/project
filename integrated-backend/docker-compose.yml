# Everything LearnMate needs running alongside the API: both databases and the identity
# provider, each in its own container with its own named volume.
#
#   docker compose up -d            start all three
#   docker compose ps               check them
#   docker compose down             stop them (the named volumes keep the data)
#   docker compose down -v          stop them AND delete the data
#
# Qdrant's dashboard is at http://localhost:6335/dashboard once it is up, and Keycloak's
# admin console at http://localhost:8081 (admin/admin).
#
# Keycloak lived in its own keycloak/docker-compose.yml when it was first merged in. It
# moved here on 2026-08-19 so that one `docker compose up -d` from this directory brings
# up everything the server talks to -- a second compose project meant a second thing to
# remember, and forgetting it produced a login page that redirected into nothing.
#
# All three publish on non-default host ports. That is deliberate: this machine
# already runs other projects' Qdrant on 6333 and a MongoDB on 27017, and sharing a
# server means sharing a failure. Another project's `docker compose down -v` would take
# LearnMate's PDFs, sessions and generated resources with it.

services:
  qdrant:
    # Pinned, and kept within one minor of the qdrant-client pin in requirements.txt --
    # the client refuses to run against a server more than one minor version away.
    #
    # Changing this tag across more than a minor version or two will crash-loop the
    # container on startup: Qdrant's on-disk segment format is not backward compatible
    # (1.18 cannot read 1.12 storage, and fails with `unknown variant 'on_disk'`). If that
    # happens, `docker compose down -v` and re-ingest. Nothing is lost -- the vectors are
    # derived from the PDFs and page text, which live in MongoDB.
    image: qdrant/qdrant:v1.18.1
    container_name: learnmate-qdrant
    restart: unless-stopped
    ports:
      # 6335, not the conventional 6333: this machine already runs a `helpmedai-qdrant`
      # container bound to 6333/6334 for a different project. Publishing on a free port
      # keeps the two corpora in separate servers rather than sharing one instance and
      # relying on collection names not to collide.
      - "6335:6333"   # REST + dashboard
      - "6336:6334"   # gRPC
    volumes:
      # A named volume, not a bind mount into the repo: Qdrant's storage engine does not
      # behave well on a Windows bind mount, and the vectors are rebuildable from the PDFs
      # in MongoDB anyway.
      - qdrant_storage:/qdrant/storage
    environment:
      # Uncomment to require an API key, then set LEARNMATE_QDRANT_API_KEY to match.
      # QDRANT__SERVICE__API_KEY: change-me
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The image is distroless, so there is no curl or wget to call. Qdrant ships a
      # readiness probe on the REST port; exec'ing the binary itself is the supported way.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    # Holds everything that is not a vector: the uploaded PDFs (GridFS), the cleaned page
    # text, session bindings, chat history, generated resources and the evaluation log.
    # Losing this loses the corpus; losing Qdrant only costs a re-ingest.
    image: mongo:8
    container_name: learnmate-mongo
    restart: unless-stopped
    ports:
      # 27018, not 27017. Port 27017 on this machine is already answered by a native
      # MongoDB service that also hosts two other projects' databases -- publishing there
      # would either fail to bind or silently be shadowed by it, which is exactly the
      # confusion this port choice avoids. Set LEARNMATE_MONGODB_URI to match.
      - "27018:27017"
    volumes:
      # Named volume, so `docker compose down` keeps the corpus and only `down -v` clears
      # it. This is the "memory" of the system: PDFs and page text are not derivable from
      # anything else.
      - mongo_data:/data/db
    command: ["--wiredTigerCacheSizeGB", "1"]
    healthcheck:
      # mongosh ships in the mongo:8 image; a ping is enough to know it is accepting
      # connections rather than still recovering its journal.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  keycloak:
    # The identity provider. Tokens it issues are verified by app/auth/keycloak.py against
    # this realm's JWKS, so the issuer URL below and KEYCLOAK_ISSUER in .env must agree
    # exactly -- a trailing slash or a 127.0.0.1/localhost mismatch fails verification with
    # an unhelpful "Invalid issuer".
    #
    # start-dev, not start: it runs HTTP without a certificate and keeps the realm in the
    # embedded database. That is the right trade for a development identity provider and
    # the wrong one for anything reachable from outside this machine.
    image: quay.io/keycloak/keycloak:26.0
    container_name: learnmate-keycloak
    restart: unless-stopped
    # --import-realm provisions the learnmate realm, its public client and a dev user from
    # the mounted JSON the first time the volume is empty. It is a no-op once the realm
    # exists, so this is safe to leave on: edits made in the admin console are not
    # clobbered on the next restart. To pick up a change to the file, `down -v` first.
    command: start-dev --import-realm
    environment:
      # Bootstrap credentials for the master realm's admin console, applied only when the
      # volume is empty. Changing them later does nothing; you have to `down -v` first.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8081 on the host: 8080 is a common default and this machine already answers there
      # with another project's frontend. The container port stays 8080, which is what
      # Keycloak's own issuer URLs are built from.
      - "8081:8080"
    volumes:
      # Holds the realm, its clients and its users. `docker compose down` keeps them;
      # `down -v` deletes them and the realm has to be created again from scratch.
      - keycloak_data:/opt/keycloak/data
      # Both read-only: this is repo source, and nothing in the container should rewrite it.
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # The LearnMate login theme, selected by the realm's loginTheme. start-dev disables
      # theme caching, so edits under here show up on a browser refresh with no restart.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image is distroless -- no curl, no wget -- but it ships a JDK, so Java's own
      # HTTP client is the one thing guaranteed to be present. KC_HEALTH_ENABLED puts the
      # probe on the management port 9000, which is deliberately not published.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  # Both are named volumes managed by Docker, so the data survives `docker compose down`,
  # a container upgrade, and a host reboot. Docker prefixes them with the project
  # directory name, so they appear as integrated-backend_qdrant_storage and
  # integrated-backend_mongo_data in `docker volume ls`.
  #
  # The corpus was migrated into these on 2026-08-14 from the components-dinura_* volumes,
  # which the containers used while this project still shared components-Dinura's compose
  # project. Those old volumes are still on disk, holding that day's snapshot, until
  # `docker volume rm components-dinura_mongo_data components-dinura_qdrant_storage`.
  qdrant_storage:
  mongo_data:
  keycloak_data:
