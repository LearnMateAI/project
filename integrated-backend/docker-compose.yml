# Both of LearnMate's databases, each in its own container with its own named volume.
#
#   docker compose up -d            start both
#   docker compose ps               check them
#   docker compose down             stop them (the named volumes keep the data)
#   docker compose down -v          stop them AND delete the data
#
# Qdrant's dashboard is at http://localhost:6335/dashboard once it is up.
#
# Both services publish on non-default host ports. That is deliberate: this machine
# already runs other projects' Qdrant on 6333 and a MongoDB on 27017, and sharing a
# server means sharing a failure. Another project's `docker compose down -v` would take
# LearnMate's PDFs, sessions and generated resources with it.

services:
  qdrant:
    # Pinned, and kept within one minor of the qdrant-client pin in requirements.txt --
    # the client refuses to run against a server more than one minor version away.
    #
    # Changing this tag across more than a minor version or two will crash-loop the
    # container on startup: Qdrant's on-disk segment format is not backward compatible
    # (1.18 cannot read 1.12 storage, and fails with `unknown variant 'on_disk'`). If that
    # happens, `docker compose down -v` and re-ingest. Nothing is lost -- the vectors are
    # derived from the PDFs and page text, which live in MongoDB.
    image: qdrant/qdrant:v1.18.1
    container_name: learnmate-qdrant
    restart: unless-stopped
    ports:
      # 6335, not the conventional 6333: this machine already runs a `helpmedai-qdrant`
      # container bound to 6333/6334 for a different project. Publishing on a free port
      # keeps the two corpora in separate servers rather than sharing one instance and
      # relying on collection names not to collide.
      - "6335:6333"   # REST + dashboard
      - "6336:6334"   # gRPC
    volumes:
      # A named volume, not a bind mount into the repo: Qdrant's storage engine does not
      # behave well on a Windows bind mount, and the vectors are rebuildable from the PDFs
      # in MongoDB anyway.
      - qdrant_storage:/qdrant/storage
    environment:
      # Uncomment to require an API key, then set LEARNMATE_QDRANT_API_KEY to match.
      # QDRANT__SERVICE__API_KEY: change-me
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The image is distroless, so there is no curl or wget to call. Qdrant ships a
      # readiness probe on the REST port; exec'ing the binary itself is the supported way.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    # Holds everything that is not a vector: the uploaded PDFs (GridFS), the cleaned page
    # text, session bindings, chat history, generated resources and the evaluation log.
    # Losing this loses the corpus; losing Qdrant only costs a re-ingest.
    image: mongo:8
    container_name: learnmate-mongo
    restart: unless-stopped
    ports:
      # 27018, not 27017. Port 27017 on this machine is already answered by a native
      # MongoDB service that also hosts two other projects' databases -- publishing there
      # would either fail to bind or silently be shadowed by it, which is exactly the
      # confusion this port choice avoids. Set LEARNMATE_MONGODB_URI to match.
      - "27018:27017"
    volumes:
      # Named volume, so `docker compose down` keeps the corpus and only `down -v` clears
      # it. This is the "memory" of the system: PDFs and page text are not derivable from
      # anything else.
      - mongo_data:/data/db
    command: ["--wiredTigerCacheSizeGB", "1"]
    healthcheck:
      # mongosh ships in the mongo:8 image; a ping is enough to know it is accepting
      # connections rather than still recovering its journal.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  # Both are named volumes managed by Docker, so the data survives `docker compose down`,
  # a container upgrade, and a host reboot. Docker prefixes them with the project
  # directory name, so they appear as integrated-backend_qdrant_storage and
  # integrated-backend_mongo_data in `docker volume ls`.
  #
  # The corpus was migrated into these on 2026-08-14 from the components-dinura_* volumes,
  # which the containers used while this project still shared components-Dinura's compose
  # project. Those old volumes are still on disk, holding that day's snapshot, until
  # `docker volume rm components-dinura_mongo_data components-dinura_qdrant_storage`.
  qdrant_storage:
  mongo_data:
