# The LearnMate login theme.
#
# Inherits keycloak.v2 -- the stock Keycloak 26 login theme -- rather than `base`, so every
# page this realm can serve (login, registration, password reset, OTP, error, the consent
# screen) keeps working without a template for each. Only two things are replaced: one
# stylesheet appended after PatternFly's, and template.ftl, which adds the blue panel.
#
# `styles` is a full override, not an append, so the parent's own entries have to be
# repeated here or the page arrives unstyled.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/learnmate.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
