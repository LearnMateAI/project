<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="LearnMateAI">
  <!--
    The sidebar brand mark, drawn at favicon size: the same gradient rounded square and
    the same academic-cap glyph as src/components/Sidebar.jsx, so the browser tab and the
    app header are recognisably one thing.

    Colours are the literal values of the color-primary and color-accent custom properties
    in src/index.css. They are inlined because a favicon is fetched as a standalone
    document and never sees the stylesheet, so if those tokens are retuned this file is the
    second place to change.

    Geometry follows the sidebar's own proportions: a 36px box with a 12px radius
    (rounded-xl) holding a 20px glyph, scaled up by 64/36. The radius is a third of the
    side and the glyph is centred, which is what keeps it reading correctly when the
    browser paints it at 16px.
  -->
  <defs>
    <!-- bg-gradient-to-br: top left to bottom right. -->
    <linearGradient id="brand" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2340E0"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="21.33" fill="url(#brand)"/>

  <!--
    Heroicons "academic-cap" (outline), authored against a 24 unit viewBox. Kept in those
    units inside a transform rather than re-scaled by hand, so the path stays diffable
    against the copy in Sidebar.jsx and stroke-width 2 still means what it means there.
  -->
  <g transform="translate(14.22 14.22) scale(1.4815)">
    <path
      d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
