  <h2>Problem and users</h2>
  <ul>
    <li><strong>User:</strong> a Sri Lankan law student on a laptop.</li>
    <li><strong>Job:</strong> upload a statute or lecture PDF; ask questions that should be <em>grounded in that file</em>; generate summary, key points, MCQ, practice questions.</li>

  </ul>

<section>
  <div class="kicker">Live product</div>
  <h2>How a slow request is served</h2>
  <p class="lead">Write job to Mongo <em>first</em> → return 202 <code>{job_id}</code> → one worker thread → UI polls.</p>
  <ul>
    <li><strong>One worker</strong> is correctness: llama.cpp has a single mutable context. A pool would interleave tokens.</li>
    <li>Locks live next to the model: <code>_LLAMA_LOCK</code>, load locks for embeddings/rerank.</li>
    <li>Engine never raises HTTPException. <code>app/errors.py</code> maps storage down → 503, bad PDF → 400.</li>
  </ul>
  <div class="notes">If they ask “why not async gather four chats?” — quietly wrong answers, not a crash.</div>
</section>

<section>
  <div class="kicker">Live product</div>
  <h2>Chat graph — one turn</h2>
  <p><code>rewrite → retrieve → generate → evaluate → decide → persist</code></p>
  <p class="small">Only one conditional edge. Retry at most once. If the judge is silent or the score is hopeless, persist anyway — a mid-conversation user needs an answer more than silence. <code>accepted</code> tells the truth.</p>
  <ul>
    <li>Retrieve: cosine wide, MiniLM rerank narrow. Mode is a <strong>score threshold</strong>, not a second LLM.</li>
    <li><code>pdf</code> vs <code>general</code> chooses <code>CHAT_GROUNDED</code> vs <code>CHAT_GENERAL</code>.</li>
    <li>Writer and judge are <strong>different families</strong> so the retry loop still fires.</li>
  </ul>
  <div class="notes">Credit teammates. File: learnmate/chat_agent/graph.py, retrieve.py, routing.py, evaluator/rubrics.py.</div>
</section>

<section>
  <div class="kicker">Stage 1</div>
  <h2>Corpus decisions — <code>lm-legal-v0.1</code></h2>
  <ul>
    <li><strong>Manifest is authority</strong> for <code>subject_area</code> — not filename keywords (<code>verify_manifest.py</code>).</li>
    <li><strong>Black’s Law 1891 excluded</strong> — US dictionary; 11 MB would have dominated chunks.</li>
    <li><strong>No OCR</strong> on two scans. Text-layer replacements identified; not mixed into this version.</li>
    <li>Inherit <code>section_id</code> onto continuation chunks; drop TOC/index fragments.</li>
    <li>Some <code>documents.gov.lk</code> URLs 404 after a site rebuild — marked stale in the manifest, not hidden.</li>
  </ul>
  <div class="notes">Misnamed file story if asked: Mediation Boards Act no 27 — no such Act; likely 72 of 1988. Not in v0.1.</div>
</section>

<section>
  <div class="kicker">GI-001</div>
  <h2>Ungrounded citations in training data</h2>
  <p class="lead">Spot check: <span class="fail">15 / 40 pairs (38%)</span> cited a section the excerpt never contained. Concentrated in summaries.</p>
  <div class="row two">
    <div class="box">
      <h3>Causes</h3>
      <p class="small">Continuation chunks with no restated number → model filled from memory (“Section 2” from a subsection “(2)”). TOC chunks → answer about a commission not in the excerpt at all.</p>
    </div>
    <div class="box">
      <h3>Fixes</h3>
      <p class="small">Drop TOC · inherit section_id · citation rule in the prompt · fail-closed <code>validate_pairs.py</code>. Full corpus: <strong>1.0% reject</strong>. Tests pin six cases so the regex cannot drift.</p>
    </div>
  </div>
  <p class="small" style="margin-top:14px">Training on invented citations teaches the behaviour the promotion gate exists to kill.</p>
  <div class="notes">This is your strongest “I found a real bug and measured the fix” story.</div>
</section>

<section>
  <div class="kicker">GI-002</div>
  <h2>Whole-document split was unusable</h2>
  <ul>
    <li>19 documents, wildly unequal size (Criminal Procedure 312 chunks vs 16).</li>
    <li>Most subjects have <strong>one</strong> document → a subject must land entirely in one split.</li>
    <li>Result: <code>family_law</code> and <code>property_land</code> with <strong>zero training pairs</strong>; val 80% one subject.</li>
  </ul>
  <p>Fix: group by <code>(doc_id, chapter)</code> — 189 units — every subject in train/val/test, <strong>plus</strong> <code>test_strict</code> (four whole unseen documents).</p>
  <p class="gold">Those two accuracies are not the same number and must never be averaged.</p>
  <div class="notes">family_law skipped for strict holdout: only two docs; holding one out recreates the bug.</div>
</section>

<section>
  <div class="kicker">GI-002 continued</div>
  <h2>Two metrics, on purpose</h2>
  <table>
    <tr><th>Name in registry</th><th>Split</th><th>Measures</th></tr>
    <tr><td><code>in_corpus_accuracy (chapter-held-out)</code></td><td>test.jsonl · 325</td><td>Chapters of statutes partly seen in training</td></tr>
    <tr><td><code>accuracy (document-held-out)</code></td><td>test_strict.jsonl · 280</td><td>A statute never seen at any granularity</td></tr>
  </table>
  <p class="small">The YAML 0.70 bar was written against the <strong>second</strong>. Clearing the first alone is not a promotion. Six subjects still have no true holdout — a corpus gap, not a splitter bug.</p>
  <div class="notes">List if asked: administrative_public, company_commercial, criminal_law, evidence, intellectual_property, property_land.</div>
</section>

<section>
  <div class="kicker">Why this is success</div>
  <h2>Fail-closed is the design</h2>
  <ul>
    <li>A 1.5B adapter that loses the judge <strong>and</strong> the API would be a product regression vs the live 3B GGUF.</li>
    <li>More epochs will not add a second Evidence Act. Six subjects have one source document.</li>
    <li>HTTP swap is already coded in <code>learnmate/llm/http_api.py</code> — unused until a pass.</li>
    <li>MLOps: retrain → evaluate → stage → promote → monitor → rollback. Process exists; automation into FastAPI does not, on purpose.</li>
  </ul>
  <div class="notes">If they push “just wire it in for the demo” — refuse. Serving 0.557 vs 0.871 is worse than the baseline.</div>
</section>

<section>
  <div class="kicker">Challenges</div>
  <h2>What was actually hard</h2>
  <ol>
    <li>Citation hallucination <em>in the training set</em> — GI-001.</li>
    <li>A legally correct split that left subjects with zero train — GI-002.</li>
    <li>A regex that lied about groundedness; token-F1 that lied about correctness.</li>
    <li>Colab drift, dtypes, T4 VRAM — solved without claiming a pass.</li>

<script>
  const stage = document.getElementById("stage");
  const src = document.getElementById("slides");
  const slides = [...src.content.querySelectorAll("section")].map((s) => {
    const el = document.createElement("article");
    el.className = "slide";
    el.innerHTML = s.innerHTML;
    stage.appendChild(el);
    return el;
  });
  let i = 0;
  const notesOn = { value: false };
  function render() {
    slides.forEach((s, n) => s.classList.toggle("on", n === i));
    document.getElementById("pos").textContent = (i + 1) + " / " + slides.length;
    document.getElementById("progress").style.width = ((i + 1) / slides.length * 100) + "%";
    slides[i].querySelectorAll(".notes").forEach((n) => n.classList.toggle("show", notesOn.value));
    history.replaceState(null, "", "#s" + (i + 1));
  }
  function go(d) {
    i = Math.max(0, Math.min(slides.length - 1, i + d));
    render();
  }
  function toggleNotes() {
    notesOn.value = !notesOn.value;
    render();
  }
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
    if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
    if (e.key === "n" || e.key === "N") toggleNotes();
    if (e.key === "Home") { i = 0; render(); }
    if (e.key === "End") { i = slides.length - 1; render(); }
  });
  const hash = location.hash.match(/s(\d+)/);
  if (hash) i = Math.min(slides.length - 1, Math.max(0, parseInt(hash[1], 10) - 1));
  render();
</script>
