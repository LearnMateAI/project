<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Shell - Database Performance Statistics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1e1e1e; color: #d4d4d4; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.5; padding: 20px; }
        .terminal { background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 6px; overflow: hidden; max-width: 1100px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .titlebar { background: #3c3c3c; padding: 8px 12px; display: flex; gap: 8px; border-bottom: 1px solid #2d2d2d; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f57; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #28ca42; }
        .prompt { color: #6a9955; } .command { color: #d4d4d4; }
        .output { padding: 16px; white-space: pre-wrap; }
        .db { color: #569cd6; font-weight: bold; }
        .number { color: #b5cea8; }
        .string { color: #ce9178; }
        .keyword { color: #c586c0; }
        .comment { color: #6a9955; }
        .object { color: #dcdcaa; }
        .success { color: #4ec9b0; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="titlebar"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div><span style="color: #858585; margin-left: 8px;">mongosh</span></div>
        <div class="output"><span class="prompt">test></span> <span class="command">use learnmate</span>
<span class="output">switched to db <span class="db">learnmate</span></div>
    </div>
</body>
</html>
