<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qdrant Dashboard - Vector Database Statistics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #333; }
        .qdrant { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: #2c3e50; color: white; padding: 20px 24px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.5rem; font-weight: 600; }
        header .version { background: #34495e; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 24px 0; }
        .stat-card { background: white; border: 1px solid #e1e1e1; border-radius: 8px; padding: 20px; }
        .stat-card h3 { color: #666; font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: #2c3e50; }
        .stat-card .value.green { color: #27ae60; }
        .collection-card { background: white; border: 1px solid #e1e1e1; border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
        .collection-header { background: #2c3e50; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .collection-header h2 { font-size: 1.2rem; font-weight: 600; }
        .collection-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; padding: 24px; border-bottom: 1px solid #e1e1e1; }
        .meta-item { padding: 12px; background: #f8f9fa; border-radius: 6px; }
        .meta-item label { display: block; color: #666; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 4px; }
        .meta-item span { font-family: monospace; font-size: 0.95rem; font-weight: 600; color: #333; }
        .tabs { display: flex; gap: 8px; padding: 0 24px 24px; }
        .tab { padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 4px 4px 0 0; cursor: pointer; font-weight: 500; color: #666; }
        .tab.active { background: white; color: #3498db; border-bottom: 2px solid #3498db; }
    </style>
</head>
<body>
    <div class="qdrant">
        <header>
            <h1>🔍 Qdrant Vector Database</h1>
            <div class="version">v1.18.1 · Cluster: learnmate-qdrant</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Collections</h3>
                <div class="value">1</div>
            </div>
            <div class="stat-card">
                <h3>Total Vectors</h3>
                <div class="value green">1,247</div>
            </div>
            <div class="stat-card">
                <h3>Indexed Vectors</h3>
                <div class="value green">1,247</div>
            </div>
            <div class="stat-card">
                <h3>Segments</h3>
                <div class="value">2</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active">📊 Dashboard</button>
            <button class="tab">🔧 Collections</button>
            <button class="tab">📸 Snapshots</button>
            <button class="tab">⚙️ Optimizers</button>
            <button class="tab">🏷️ Payload Indexes</button>
            <button class="tab">📈 Telemetry</button>
        </div>

        <div class="collection-card">
            <div class="collection-header">
                <h2>learnmate_documents</h2>
                <span style="background: #27ae60; color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem;">ACTIVE</span>
            </div>
            <div class="collection-meta">
                <div class="meta-item"><label>Vector Size</label><span>384</span></div>
                <div class="meta-item"><label>Distance</label><span>Cosine</span></div>
                <div class="meta-item"><label>Points Count</label><span>1,247</span></div>
                <div class="meta-item"><label>Segments</label><span>2</span></div>
                <div class="meta-item"><label>HNSW M</label><span>16</span></div>
                <div class="meta-item"><label>ef_construct</label><span>100</span></div>
                <div class="meta-item"><label>Status</label><span style="color: #27ae60;">✓ Healthy</span></div>
                <div class="meta-item"><label>Disk Usage</label><span>~42 MB</span></div>
            </div>
        </div>
    </div>
</body>
</html>
